        <style>
            .hero {
                height: 100vh;

                display: flex;
                justify-content: center;
                align-items: center;

                text-align: center;

                position: relative;
            }



            .scroll-down {
                position: absolute;
                bottom: 60px;

                opacity: 0;
                pointer-events: none;

                transition: opacity 0.5s ease;
            }

            .scroll-down.visible {
                opacity: 1;
            }

            .scroll-down.hidden {
                opacity: 0;
            }

            @keyframes scrollDown {
                from {
                    opacity: 0;
                    transform: translateY(-5px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>





        <script>
            const scrollDown = document.querySelector(".scroll-down");

            // Show after 1 second if we're still at the top.
            setTimeout(() => {
                if (window.scrollY === 0) {
                    scrollDown.classList.add("visible");
                }
            }, 3000);

            window.addEventListener("scroll", () => {
                if (window.scrollY === 0) {
                    scrollDown.classList.add("visible");
                } else {
                    scrollDown.classList.remove("visible");
                }
            });


            const heroHeader = document.querySelector(".hero header");

            heroHeader.addEventListener("mousemove", (event) => {
                const rect = heroHeader.getBoundingClientRect();

                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;

                heroHeader.style.setProperty("--mouse-x", `${x}px`);
                heroHeader.style.setProperty("--mouse-y", `${y}px`);
            });
        </script>
