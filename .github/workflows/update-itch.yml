name: Update itch.io game data

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-itch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch itch.io game data
        env:
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          curl -f \
            -H "Authorization: Bearer $ITCH_API_KEY" \
            "https://api.itch.io/profile/games" \
            -o itch_game_data.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add itch_game_data.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update itch.io game data"
            git push
          fi
